id: "01-navigation"
number: 1
title: "Getting around"
description: "Explore a small project using pwd, ls, and cd."
pages:
  - title: "pwd — where am I?"
    content: |
      `pwd` means “print working directory”. It tells you the full path of the
      directory your shell is currently using.

      Start by running:

          pwd

      Shellforge starts you in `/home/student/workspace`. Every relative path
      you type is interpreted from this directory.

  - title: "ls — what is here?"
    content: |
      `ls` lists the files and directories in your current directory.

          ls

      Useful flags:

      - `-a` includes hidden names such as `.config`.
      - `-A` includes hidden names except `.` and `..`.
      - `-l` uses a detailed, one-item-per-line view.
      - `-h` makes sizes easier to read; combine it with `-l` as `ls -lh`.
      - `-t` sorts by newest modification time; `-S` sorts by size.
      - `-r` reverses the selected sort order.
      - `-R` lists subdirectories recursively.
      - `-d` describes a directory itself instead of listing its contents.

      Flags can be combined: `ls -lah`. Run `ls --help` or `man ls` for GNU
      ls’s complete reference.

  - title: "cd — move between directories"
    content: |
      `cd` means “change directory”. It changes where subsequent commands run.

          cd project
          cd docs
          cd ..
          cd /home/student/workspace
          cd with no arguments returns you to your home directory.

      `..` means the parent directory. An absolute path begins with `/`; a
      relative path begins from your current directory.

      ## Your task>

      Use `pwd`, `ls`, and `cd` to find `project/docs/README.md`, then return
      to the workspace.
hints:
  - "Start with `pwd`, then use `ls` to see the workspace."
  - "You can move through the tree one directory at a time."
setup: |
  mkdir -p /home/student/workspace/project/src
  mkdir -p /home/student/workspace/project/docs
  mkdir -p /home/student/workspace/project/tests
  printf '%s\n' 'Welcome to Shellforge!' > /home/student/workspace/project/docs/README.md
  chown -R student:student /home/student/workspace
assertions:
  - type: directory_exists
    path: project/docs
  - type: file_exists
    path: project/docs/README.md
success_message: "You have explored a Unix directory tree."
