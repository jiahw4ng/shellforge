id: "00-debugging"
number: 0
title: "Debugging"
description: "Exercise Shellforge's lesson rendering and progress assertions."
pages:
  - title: "Debug 12345"
    file: "00-debugging/01-debug.md"
hints:
  - "Use this lesson to verify Markdown rendering and progress assertions."
setup: |
  chown -R student:student /home/student
assertions:
  - type: directory_exists
    path: debug
  - type: file_exists
    path: debug/foo.txt
  - type: file_content
    path: debug/bar.txt
    contains: "sup"
  - type: file_mode
    path: debug/baz.txt
    mode: "755"
  - type: command_history_contains
    contains: "echo abc"
  - type: cwd
    path: /home/student/newdir
  - type: environment_variable_exists
    name: MY_VAR
success_message: "All debug progress checks passed!"
