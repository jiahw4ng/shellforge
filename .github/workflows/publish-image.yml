name: Publish sandbox image

on:
  # Only a version tag publishes. CI still builds the image for amd64 and arm64 on
  # every push to main (without pushing), so a broken image is caught before tagging.
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # internal/container/consts.go (imageRepository, imageVersion) is the only place that names the image, so
      # the published tag cannot drift from the one the app pulls.
      - name: Read the image reference from the source
        id: image
        run: |
          repository=$(sed -nE 's/^[[:space:]]*imageRepository[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/container/consts.go)
          version=$(sed -nE 's/^[[:space:]]*imageVersion[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' internal/container/consts.go)
          if [ -z "$repository" ] || [ -z "$version" ]; then
            echo "::error::could not find imageRepository and imageVersion in internal/container/consts.go"
            exit 1
          fi
          echo "name=${repository}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # A release tag must be semver and name the version the app pulls, e.g.
      # v0.1.0 for :0.1.0.
      - name: Check the release tag matches the image version
        env:
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          # Plain MAJOR.MINOR.PATCH only: every tag moves :latest and creates a
          # normal release, so a pre-release suffix would ship as final.
          if ! [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME is not v<MAJOR>.<MINOR>.<PATCH>"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v${VERSION}" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match image version $VERSION in consts.go"
            exit 1
          fi

      # Lets the amd64 runner build the arm64 variant under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publishes the version the app pins, and :latest. Nothing else is pushed,
      # so a released binary never sees its image change.
      - name: Build and push lesson sandbox image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/lesson.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
